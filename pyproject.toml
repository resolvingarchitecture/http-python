[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# "ra-http"/"ra_http", not bare "http": this package's own code does
# `import http.client`/`from http.server import ...` (Python's real stdlib
# http module) - naming the importable module plain "http" would shadow (and
# likely lose to) the stdlib module of the same name. Every other language's
# HTTP port dropped "-client" to plain "http"; this is the one exception.
name = "ra-http"
version = "0.1.0"
description = "A direct (non-anonymized) HTTP/HTTPS client for the RA / 1M5 ecosystem."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Brian Taylor", email = "brian@resolvingarchitecture.io" }]
keywords = ["http", "https", "network", "1m5"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["ra-common"]

[project.urls]
Homepage = "https://resolvingarchitecture.io"
Repository = "https://github.com/resolvingarchitecture/http-python"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ra_http"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
