[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "http-client"
version = "0.1.0"
description = "A direct (non-anonymized) HTTP/HTTPS client for the RA / 1M5 ecosystem."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Brian Taylor", email = "brian@resolvingarchitecture.io" }]
keywords = ["http", "https", "network", "1m5"]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries",
]
dependencies = ["ra-common"]

[project.urls]
Homepage = "https://resolvingarchitecture.io"
Repository = "https://github.com/resolvingarchitecture/http-client-python"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/http_client"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
